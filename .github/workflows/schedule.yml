name: TUI Price Checker

on:
  schedule:
    # Upozornění: GitHub Actions běží v čase UTC.
    # Časy níže jsou nastaveny pro český zimní čas (CET = UTC+1).
    # Spouští se pouze v pracovní dny (1-5 = pondělí až pátek).

    # 1. RÁNO (7:30 a 7:45)
    # UTC: 06:30 a 06:45
    - cron: '30,45 6 * * 1-5'

    # 2. HLAVNÍ ČÁST DNE (8:00 - 21:45)
    # UTC: 07:00 - 20:45 (běží každých 15 minut)
    - cron: '*/15 7-20 * * 1-5'

    # 3. KONEC (22:00)
    # UTC: 21:00 (poslední zpráva dne)
    - cron: '0 21 * * 1-5'

  workflow_dispatch:

jobs:
  check_price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
